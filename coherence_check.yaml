name: code_doc_coherence_check

on: [push, merge, pull request]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # current commit + the one before it

      - name: Save git diff to file
        run: git diff HEAD^ HEAD > diff_output.txt

      - name: Make script executable
        run: chmod +x coherence_check.sh

      - name: Run coherence check
        run: ./coherence_check.sh ${{ vars.DOC_SOURCE }} diff_output.txt