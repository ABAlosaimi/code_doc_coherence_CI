name: Diff Check
on: [push, merge, pull request]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # current commit + the one before it

      - name: Show diff vs previous commit
        run: |
          git diff HEAD^ HEAD
      
      - name: Get the documentation from the source
        run: |
          ${{ vars.DOC_SOURCE }}